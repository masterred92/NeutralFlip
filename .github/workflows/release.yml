# Packages and publishes to CurseForge, Wago and GitHub Releases. Runs ONLY when a v* tag is pushed
# (e.g. v0.1.0 or v0.1.0-beta1; use annotated tags). Before the first tag, Kenny must:
#   - create the CurseForge and Wago projects and add their IDs to NeutralFlip.toc
#     (## X-Curse-Project-ID: <id> and ## X-Wago-ID: <id>)
#   - add repo secrets CF_API_TOKEN and WAGO_API_TOKEN (GITHUB_TOKEN is automatic)
name: Package and release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # lets the packager create the GitHub release

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: leafo/gh-actions-lua@v13.1.0
        with:
          luaVersion: "5.1.5"
      - uses: leafo/gh-actions-luarocks@v6.1.1
      - name: Install luacheck
        run: luarocks install luacheck
      - name: Syntax, lint, mock-client tests
        run: sh tests/run.sh

  release:
    needs: test
    runs-on: ubuntu-latest
    env:
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
      GH_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # full history for the changelog
      - name: Package and upload
        uses: BigWigsMods/packager@v2
