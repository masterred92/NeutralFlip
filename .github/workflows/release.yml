# Packages and publishes to CurseForge, Wago and GitHub Releases. Runs ONLY when a v* tag is pushed.
# A plain tag (v0.1.0, v0.1.1) publishes as a full Release; a tag containing "beta" or "alpha" would publish as beta/alpha.
# Use annotated tags. Project IDs are already in NeutralFlip.toc. Before the first tag, Kenny must add the repo secrets
# CF_API_TOKEN and WAGO_API_TOKEN (GITHUB_TOKEN is automatic) and set workflow permissions to read/write.
name: Package and release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # lets the packager create the GitHub release

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: leafo/gh-actions-lua@v13.1.0
        with:
          luaVersion: "5.1.5"
      - uses: leafo/gh-actions-luarocks@v6.1.1
      - name: Install luacheck
        run: luarocks install luacheck
      - name: Syntax, lint, mock-client tests
        run: sh tests/run.sh

  release:
    needs: test
    runs-on: ubuntu-latest
    env:
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
      GH_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # full history for the changelog
      - name: Package and upload
        uses: BigWigsMods/packager@v2
